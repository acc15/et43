[project]
name = "et43"
version = "1.0.0"
description = "Human-friendly Python client for EastTester ET43x LCR meters (ET430-ET433)"
readme = "README.md"
authors = [
    { name = "Vyacheslav Mayorov", email = "vyacheslav.mayorov@gmail.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lcr", "lcr-meter", "scpi", "easttester", "et43", "et433", "et43x", "serialx", "asyncio", "instrument"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["serialx>=1.15.1"]

[project.urls]
Homepage = "https://github.com/acc15/et43"
Repository = "https://github.com/acc15/et43"
Issues = "https://github.com/acc15/et43/issues"

[tool.ruff]
src = ["src"]
target-version = "py314"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.bumpversion]
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
pre_commit_hooks = [
    "just check",
    "uv lock",
    "git add uv.lock",
    "uv build --clear",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
